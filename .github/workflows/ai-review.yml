name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate AI Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff origin/develop...HEAD > /tmp/pr.diff

          # diff が空ならスキップ
          if [ ! -s /tmp/pr.diff ]; then
            echo "REVIEW_BODY=差分なし。レビュースキップ。" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 差分が大きすぎる場合は先頭 200 行に絞る
          DIFF_CONTENT=$(head -200 /tmp/pr.diff)

          REVIEW=$(claude -p "以下の PR 差分をコードレビューしてください。

レビュー対象のみ指摘してください（スタイル・命名は無視）：
- バグ・ロジックエラー
- セキュリティ問題（XSS, SQLi, 認証不備など）
- テスト不足（境界値・エラーケースが未テスト）
- 型安全性の問題

指摘がなければ「問題なし」と1行で返してください。
日本語で返してください。

## PR 差分
$DIFF_CONTENT" \
            --allowedTools "" \
            --output-format text 2>/dev/null || echo "レビュー実行エラー")

          # 改行を保持して出力
          echo "REVIEW_BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## 🤖 AI Code Review

${{ steps.review.outputs.REVIEW_BODY }}

---
*このコメントは Claude Code CLI により自動生成されました（差分上位 200 行をレビュー）*"
